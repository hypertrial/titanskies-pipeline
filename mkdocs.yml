site_name: TitanSkies Pipeline
site_description: NASA TEMPO NO2 regional warehouse for Canada, the United States, and Mexico.
site_url: https://hypertrial.github.io/titanskies-pipeline/
repo_url: https://github.com/hypertrial/titanskies-pipeline
repo_name: hypertrial/titanskies-pipeline
docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: custom
    accent: custom

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js
  - assets/javascripts/mermaid.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hypertrial/titanskies-pipeline
      name: TitanSkies Pipeline on GitHub

copyright: >
  Hypertrial-owned MIT software, not a hosted dataset.
  <a href="https://hypertrial.github.io/titanskies-pipeline/concepts/scope-and-non-goals/">Scope</a> ·
  <a href="https://hypertrial.github.io/titanskies-pipeline/concepts/operator-responsibilities/">Operator responsibilities</a> ·
  <a href="https://github.com/hypertrial/titanskies-pipeline/blob/main/THIRD_PARTY_NOTICES.md">Third-Party Notices</a> ·
  <a href="https://github.com/hypertrial/titanskies-pipeline/blob/main/PRIVACY.md">Privacy</a>.

nav:
