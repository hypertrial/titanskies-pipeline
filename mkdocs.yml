  - Audiences:
      - Analysts: audiences/analysts.md
      - Operators: audiences/operators.md
      - Contributors: audiences/contributors.md
      - Integrators: audiences/integrators.md
  - Get started:
      - Quickstart: getting-started/index.md
      - Choose a scope: getting-started/choose-a-scope.md
      - Build geography artifacts: getting-started/build-geography-artifacts.md
      - Upgrade to v0.2: getting-started/upgrade-v02.md
      - Upgrade to v0.3: getting-started/upgrade-v03.md
      - Upgrade to v0.4: getting-started/upgrade-v04.md
  - Guides:
      - Run the pipeline: guides/run-the-pipeline.md
      - Backfill 30 days: guides/backfill-30-days.md
      - Query the warehouse: guides/query-the-warehouse.md
      - Query recipes: guides/query-recipes.md
      - Day-two operations: guides/day-two-operations.md
      - Live readiness: guides/live-readiness.md
      - Enable the schedule: guides/enable-schedule.md
      - Validate and recover: guides/validate-and-recover.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Configuration: reference/configuration.md
      - Orchestration: reference/orchestration.md
      - Warehouse: reference/warehouse.md
      - Data contracts: reference/data-contracts.md
      - Data dictionary: reference/data-dictionary.md
      - Scripts: reference/scripts.md
      - Naming: reference/naming.md
      - Legal and privacy: reference/legal.md
  - Concepts:
      - System overview: concepts/system-overview.md
      - Architecture: concepts/architecture.md
      - TEMPO product notes: concepts/tempo-product-notes.md
      - Scope and non-goals: concepts/scope-and-non-goals.md
      - Operator responsibilities: concepts/operator-responsibilities.md
      - FAQ: concepts/faq.md
      - Glossary: concepts/glossary.md
      - Design decisions: concepts/decisions.md
      - Integration: concepts/integration.md
  - Development:
      - Development guide: development/index.md
      - Community: development/community.md
      - Releasing: development/releasing.md
      - Changelog: development/changelog.md
